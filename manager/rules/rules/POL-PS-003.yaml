rule_code: "POL-PS-003"
name: "PowerShell Execution Policy Bypass"
category: "powershell"
severity: "medium"
mitre_technique_id: "T1059.001"
score_impact: 25
enabled: true
mode: "ALERT_ONLY"
response_action: "ALERT"
condition:
  all:
    - field: "collector_type"
      op: "eq"
      value: "process"
    - field: "data.process_name"
      op: "contains_icase"
      value: "powershell.exe"
    - field: "data.command_line"
      op: "contains_icase"
      value: "-executionpolicy"
    - field: "data.command_line"
      op: "contains_icase"
      value: "bypass"
false_positive_notes: "Admin scripts running custom modules."
references:
  - "https://attack.mitre.org/techniques/T1059/001/"
