rule_code: "POL-PS-005"
name: "Obfuscated or Gzip Compressed PowerShell Payload"
category: "powershell"
severity: "high"
mitre_technique_id: "T1027"
score_impact: 35
enabled: true
mode: "ALERT_ONLY"
response_action: "ALERT"
condition:
  all:
    - field: "collector_type"
      op: "eq"
      value: "process"
    - field: "data.process_name"
      op: "contains_icase"
      value: "powershell.exe"
    - field: "data.command_line"
      op: "regex"
      value: "(IO\\.Compression|GzipStream|Decompress|FromBase64String)"
false_positive_notes: "Compressed deployment manifests."
references:
  - "https://attack.mitre.org/techniques/T1027/"
